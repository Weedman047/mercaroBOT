name: 🤖 Robô Mercaro (SuperKoch & Fort Atacadista • Enxame Multi-Máquinas)

on:
  # 1. Permite iniciar manualmente com 1 clique pelo Celular ou PC
  workflow_dispatch:
    inputs:
      mercado:
        description: "🛒 Mercado a Coletar (ambos = Koch + Fort em paralelo, koch = só SuperKoch, fort = só Fort Atacadista)"
        required: false
        default: "ambos"
      total_maquinas:
        description: "🚀 Nº de Máquinas / IPs simultâneos por Mercado (1 a 10)"
        required: false
        default: "5"
      modo_fila:
        description: "⚡ Camada de Rastreamento (RADAR = ⚡ Ofertas Relâmpago 1-2 min, 2A = ⚖️ Varredura Turno Subcategorias, COMPLETA = 🌙 Noturna Geral 100%)"
        required: false
        default: "2A"
      tamanho_lote_size:
        description: "📦 Produtos por Requisição (12 = Padrão pré-selecionado; Fort máximo 20, Koch até 48)"
        required: false
        default: "12"
      delay_paginas_ms:
        description: "Tempo de espera entre páginas em ms (Recomendado: 2200)"
        required: false
        default: "2200"
      delay_categorias_ms:
        description: "Tempo de espera ao trocar de categoria em ms (Recomendado: 3800)"
        required: false
        default: "3800"
      rota_inicial:
        description: "Iniciar a partir de qual número da fila"
        required: false
        default: "1"
      salvar_ao_adicionar:
        description: "Salvar no Firebase ao adicionar X produtos novos (Padrão: 1)"
        required: false
        default: "1"
      salvar_ao_atualizar:
        description: "Salvar no Firebase ao atualizar X preços/estoques (Padrão: 50)"
        required: false
        default: "50"
      modo_teste_sem_gravar:
        description: "Modo Teste (true = NÃO grava no Firebase, false = Grava normalmente)"
        required: false
        default: "false"

  # 2. Execução automática contínua em 3 Camadas:
  # - Noturna Geral 100% às 03:00 BRT (06:00 UTC)
  # - Varredura de Turno 2A às 09:00 BRT (12:00 UTC) e 17:00 BRT (20:00 UTC)
  # - Radar de Ofertas a cada 2h durante o dia (11h, 13h, 15h, 19h, 21h BRT -> 14h, 16h, 18h, 22h, 00h UTC)
  schedule:
    - cron: "0 0,6,12,14,16,18,20,22 * * *"

jobs:
  # Etapa 1: Prepara a lista de máquinas do enxame (1 a 10 servidores com IPs independentes)
  preparar-enxame:
    runs-on: ubuntu-latest
    outputs:
      workers_json: ${{ steps.calc.outputs.workers_json }}
      total_workers: ${{ steps.calc.outputs.total_workers }}
      swarm_id: ${{ steps.calc.outputs.swarm_id }}
      mercado_escolhido: ${{ steps.calc.outputs.mercado_escolhido }}
      modo_camada: ${{ steps.calc.outputs.modo_camada }}
    steps:
      - name: 🧮 Definir parâmetros do Enxame e Camada
        id: calc
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HORA_UTC=$(date -u +%H)
            if [ "$HORA_UTC" = "06" ]; then
              MODO_CAMADA="COMPLETA"
              RAW_N="5"
            elif [ "$HORA_UTC" = "12" ] || [ "$HORA_UTC" = "20" ]; then
              MODO_CAMADA="2A"
              RAW_N="3"
            else
              MODO_CAMADA="RADAR"
              RAW_N="1"
            fi
            MERCADO="ambos"
          else
            MODO_CAMADA="${{ github.event.inputs.modo_fila || '2A' }}"
            RAW_N="${{ github.event.inputs.total_maquinas }}"
            if [ -z "$RAW_N" ]; then
              if [ "$MODO_CAMADA" = "RADAR" ]; then RAW_N="1"; else RAW_N="5"; fi
            fi
            MERCADO="${{ github.event.inputs.mercado || 'ambos' }}"
          fi

          if ! [[ "$RAW_N" =~ ^[0-9]+$ ]]; then RAW_N="3"; fi
          if [ "$RAW_N" -lt 1 ]; then RAW_N=1; fi
          if [ "$RAW_N" -gt 10 ]; then RAW_N=10; fi
          JSON_ARR=$(seq -s, 1 "$RAW_N" | sed 's/^/[/;s/$/]/')
          SWARM_ID="swarm_$(date +%s)"

          echo "workers_json=$JSON_ARR" >> $GITHUB_OUTPUT
          echo "total_workers=$RAW_N" >> $GITHUB_OUTPUT
          echo "swarm_id=$SWARM_ID" >> $GITHUB_OUTPUT
          echo "mercado_escolhido=$MERCADO" >> $GITHUB_OUTPUT
          echo "modo_camada=$MODO_CAMADA" >> $GITHUB_OUTPUT
          echo "Enxame configurado: Camada $MODO_CAMADA | $RAW_N maquina(s) por mercado (Mercado: $MERCADO | ID: $SWARM_ID)"

  # Etapa 2A: Enxame SuperKoch (Loja 1408 Itapema)
  extrator-koch:
    needs: preparar-enxame
    if: needs.preparar-enxame.outputs.mercado_escolhido != 'fort'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.preparar-enxame.outputs.workers_json) }}

    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🌐 Instalar Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🔴 Executar SuperKoch • Máquina #${{ matrix.worker_id }} de ${{ needs.preparar-enxame.outputs.total_workers }}
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          MERCADO: "koch"
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ needs.preparar-enxame.outputs.total_workers }}
          SWARM_RUN_ID: ${{ needs.preparar-enxame.outputs.swarm_id }}
          MODO_FILA: ${{ needs.preparar-enxame.outputs.modo_camada }}
          BATCH_SIZE: ${{ github.event.inputs.tamanho_lote_size || '12' }}
          DELAY_MS: ${{ github.event.inputs.delay_paginas_ms || '2200' }}
          DELAY_ROTA_MS: ${{ github.event.inputs.delay_categorias_ms || '3800' }}
          START_INDEX: ${{ github.event.inputs.rota_inicial || '1' }}
          SALVAR_AO_ADICIONAR: ${{ github.event.inputs.salvar_ao_adicionar || '1' }}
          SALVAR_AO_ATUALIZAR: ${{ github.event.inputs.salvar_ao_atualizar || '50' }}
          DRY_RUN: ${{ github.event.inputs.modo_teste_sem_gravar || 'false' }}
        run: node scripts/extrator-cloud.mjs

      - name: 📦 Backup de Segurança do Firebase SuperKoch
        if: always() && matrix.worker_id == 1
        uses: actions/upload-artifact@v4
        with:
          name: backup-koch-1408-${{ github.run_number }}
          path: backup_koch_1408_antes.json
          retention-days: 14

  # Etapa 2B: Enxame Fort Atacadista (Loja 1644 Porto Belo) - RODA SIMULTANEAMENTE!
  extrator-fort:
    needs: preparar-enxame
    if: needs.preparar-enxame.outputs.mercado_escolhido != 'koch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.preparar-enxame.outputs.workers_json) }}

    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🌐 Instalar Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🟢 Executar Fort Atacadista • Máquina #${{ matrix.worker_id }} de ${{ needs.preparar-enxame.outputs.total_workers }}
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          MERCADO: "fort"
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ needs.preparar-enxame.outputs.total_workers }}
          SWARM_RUN_ID: ${{ needs.preparar-enxame.outputs.swarm_id }}
          MODO_FILA: ${{ needs.preparar-enxame.outputs.modo_camada }}
          BATCH_SIZE: ${{ github.event.inputs.tamanho_lote_size || '12' }}
          DELAY_MS: ${{ github.event.inputs.delay_paginas_ms || '2200' }}
          DELAY_ROTA_MS: ${{ github.event.inputs.delay_categorias_ms || '3800' }}
          START_INDEX: ${{ github.event.inputs.rota_inicial || '1' }}
          SALVAR_AO_ADICIONAR: ${{ github.event.inputs.salvar_ao_adicionar || '1' }}
          SALVAR_AO_ATUALIZAR: ${{ github.event.inputs.salvar_ao_atualizar || '50' }}
          DRY_RUN: ${{ github.event.inputs.modo_teste_sem_gravar || 'false' }}
        run: node scripts/extrator-cloud.mjs

      - name: 📦 Backup de Segurança do Firebase Fort Atacadista
        if: always() && matrix.worker_id == 1
        uses: actions/upload-artifact@v4
        with:
          name: backup-fort-1644-${{ github.run_number }}
          path: backup_fort_1644_antes.json
          retention-days: 14

  # Etapa 3: Vinculação Inteligente Multi-Fator (Koch × Fort)
  vincular-produtos:
    needs: [preparar-enxame, extrator-koch, extrator-fort]
    if: always() && !cancelled() && needs.preparar-enxame.outputs.modo_camada != 'RADAR'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🔗 Executar Vinculação Inteligente de Produtos (SuperKoch × Fort Atacadista)
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: node scripts/extrator-cloud.mjs --vincular
