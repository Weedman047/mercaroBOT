name: 🤖 Robô Mercaro (SuperKoch & Fort Atacadista • Enxame Multi-Máquinas)

on:
  # 1. Permite iniciar manualmente com 1 clique pelo Celular ou PC (Operação Customizada com Prioridade)
  workflow_dispatch:
    inputs:
      mercado:
        description: "🛒 Mercado a Coletar (ambos = Koch + Fort em paralelo, koch = só SuperKoch, fort = só Fort Atacadista)"
        required: false
        default: "ambos"
      total_maquinas:
        description: "🚀 Nº de Máquinas / IPs simultâneos por Mercado (Padrão: 10)"
        required: false
        default: "10"
      modo_fila:
        description: "⚡ Camada de Rastreamento (AUTO = Ciclo Inteligente 24h/3h/12h, 24H = Contínuo 1 Máq Mais Acessados+Promo, 2A = Busca Ampla 3h 10 Máq, COMPLETA = Varredura Total 12h 10 Máq)"
        required: false
        default: "AUTO"
      tamanho_lote_size:
        description: "📦 Produtos por Requisição (20 = Teto Oficial OSuper p/ Koch e Fort • 12 = Furtivo)"
        required: false
        default: "20"
      delay_paginas_ms:
        description: "Tempo de espera entre páginas em ms (Recomendado: 2200)"
        required: false
        default: "2200"
      delay_categorias_ms:
        description: "Tempo de espera ao trocar de categoria em ms (Recomendado: 3800)"
        required: false
        default: "3800"
      rota_inicial:
        description: "Iniciar a partir de qual número da fila"
        required: false
        default: "1"
      salvar_ao_adicionar:
        description: "Salvar no Firebase ao adicionar X produtos novos (Padrão: 300)"
        required: false
        default: "300"
      salvar_ao_atualizar:
        description: "Salvar no Firebase ao atualizar/salvar X preços/estoques (Padrão: 100)"
        required: false
        default: "100"
      modo_teste_sem_gravar:
        description: "Modo Teste (true = NÃO grava no Firebase, false = Grava normalmente)"
        required: false
        default: "false"

  # 2. Execução 100% automática e ininterrupta:
  # - 24 horas sem parar: 1 máquina em cada site buscando os itens mais acessados e promoções
  # - De 3 em 3 horas: 10 máquinas em cada site fazendo busca ampla na maioria do site (balanceadas por volume de itens)
  # - De 12 em 12 horas: 10 máquinas em cada site fazendo varredura completa em todas as categorias total de todos os sites
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: write
  contents: read

# Gerenciamento Inteligente de Concorrência:
# - Disparo manual customizado pelo painel cancela a operação em andamento e assume prioridade imediata.
# - Agendamentos automáticos (schedule / AUTO) NUNCA cancelam uma operação em andamento (entram em fila limpa).
concurrency:
  group: robo-mercaro-swarm
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo_fila != 'AUTO' && github.event.inputs.modo_fila != '' }}

jobs:
  # Etapa 1: Orquestrador Automático de Ciclos (24h Contínuo 1 Máq • 3h Ampla 10 Máq • 12h Completa 10 Máq)
  preparar-enxame:
    runs-on: ubuntu-latest
    outputs:
      workers_json: ${{ steps.calc.outputs.workers_json }}
      total_workers: ${{ steps.calc.outputs.total_workers }}
      swarm_id: ${{ steps.calc.outputs.swarm_id }}
      mercado_escolhido: ${{ steps.calc.outputs.mercado_escolhido }}
      modo_camada: ${{ steps.calc.outputs.modo_camada }}
    steps:
      - name: 🧮 Definir parâmetros do Enxame e Camada (24h / 3h / 12h)
        id: calc
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          INPUT_MODO="${{ github.event.inputs.modo_fila || 'AUTO' }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$INPUT_MODO" = "AUTO" ]; then
            DECISAO=$(node -e '
              (async () => {
                const base = process.env.FIREBASE_URL;
                const sec = (process.env.FIREBASE_SECRET || "").trim();
                const q = sec ? `?auth=${encodeURIComponent(sec)}` : "";
                const agora = Date.now();
                let u12 = 0, u3 = 0;
                try {
                  const r = await fetch(`${base}/robo_controle/agendamento_auto.json${q}`, { signal: AbortSignal.timeout(8000) });
                  if (r.ok) {
                    const d = await r.json();
                    u12 = Number(d?.ultimaCompleta12hMs || 0);
                    u3 = Number(d?.ultimaAmpla3hMs || 0);
                  }
                } catch {}
                const diff12h = agora - u12;
                const diff3h = agora - u3;
                // A cada 12 horas (43.200s, tolerância 3 min): Varredura Completa Total com 10 máquinas por site
                if (!u12 || diff12h >= (12 * 3600 - 180) * 1000) {
                  console.log("COMPLETA|10");
                } else if (!u3 || diff3h >= (3 * 3600 - 180) * 1000) {
                  // A cada 3 horas (10.800s, tolerância 3 min): Busca Ampla na maioria do site com 10 máquinas por site
                  console.log("2A|10");
                } else {
                  // 24 horas sem parar: 1 máquina em cada site buscando os itens mais acessados e promoções
                  console.log("24H|1");
                }
              })();
            ')
            MODO_CAMADA=$(echo "$DECISAO" | cut -d'|' -f1)
            RAW_N=$(echo "$DECISAO" | cut -d'|' -f2)
            MERCADO="ambos"
          else
            # Operação customizada disparada manualmente pelo usuário
            MODO_CAMADA="$INPUT_MODO"
            RAW_N="${{ github.event.inputs.total_maquinas || '10' }}"
            if [ "$MODO_CAMADA" = "24H" ] && [ "${{ github.event.inputs.total_maquinas }}" = "" ]; then
              RAW_N="1"
            fi
            if [ -z "$RAW_N" ]; then
              RAW_N="10"
            fi
            MERCADO="${{ github.event.inputs.mercado || 'ambos' }}"
          fi

          if ! [[ "$RAW_N" =~ ^[0-9]+$ ]]; then RAW_N="10"; fi
          if [ "$RAW_N" -lt 1 ]; then RAW_N=1; fi
          if [ "$RAW_N" -gt 10 ]; then RAW_N=10; fi
          JSON_ARR=$(seq -s, 1 "$RAW_N" | sed 's/^/[/;s/$/]/')
          SWARM_ID="swarm_$(date +%s)"

          echo "workers_json=$JSON_ARR" >> $GITHUB_OUTPUT
          echo "total_workers=$RAW_N" >> $GITHUB_OUTPUT
          echo "swarm_id=$SWARM_ID" >> $GITHUB_OUTPUT
          echo "mercado_escolhido=$MERCADO" >> $GITHUB_OUTPUT
          echo "modo_camada=$MODO_CAMADA" >> $GITHUB_OUTPUT
          echo "Enxame configurado: Camada $MODO_CAMADA | $RAW_N maquina(s) por mercado (Mercado: $MERCADO | ID: $SWARM_ID)"

  # Etapa 2A: Enxame SuperKoch (Loja 1408 Itapema)
  extrator-koch:
    needs: preparar-enxame
    if: needs.preparar-enxame.outputs.mercado_escolhido != 'fort' && needs.preparar-enxame.outputs.mercado_escolhido != 'vincular'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.preparar-enxame.outputs.workers_json) }}

    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🌐 Instalar Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🔴 Executar SuperKoch • Máquina #${{ matrix.worker_id }} de ${{ needs.preparar-enxame.outputs.total_workers }}
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          MERCADO: "koch"
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ needs.preparar-enxame.outputs.total_workers }}
          SWARM_RUN_ID: ${{ needs.preparar-enxame.outputs.swarm_id }}
          MODO_FILA: ${{ needs.preparar-enxame.outputs.modo_camada }}
          BATCH_SIZE: ${{ github.event.inputs.tamanho_lote_size || '20' }}
          DELAY_MS: ${{ github.event.inputs.delay_paginas_ms || '2200' }}
          DELAY_ROTA_MS: ${{ github.event.inputs.delay_categorias_ms || '3800' }}
          START_INDEX: ${{ github.event.inputs.rota_inicial || '' }}
          SALVAR_AO_ADICIONAR: ${{ github.event.inputs.salvar_ao_adicionar || '300' }}
          SALVAR_AO_ATUALIZAR: ${{ github.event.inputs.salvar_ao_atualizar || '100' }}
          DRY_RUN: ${{ github.event.inputs.modo_teste_sem_gravar || 'false' }}
        run: node scripts/extrator-cloud.mjs

      - name: 📦 Backup de Segurança do Firebase SuperKoch
        if: always() && matrix.worker_id == 1
        uses: actions/upload-artifact@v4
        with:
          name: backup-koch-1408-${{ github.run_number }}
          path: backup_koch_1408_antes.json
          retention-days: 14

  # Etapa 2B: Enxame Fort Atacadista (Loja 1644 Porto Belo) - RODA SIMULTANEAMENTE!
  extrator-fort:
    needs: preparar-enxame
    if: needs.preparar-enxame.outputs.mercado_escolhido != 'koch' && needs.preparar-enxame.outputs.mercado_escolhido != 'vincular'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.preparar-enxame.outputs.workers_json) }}

    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🌐 Instalar Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🟢 Executar Fort Atacadista • Máquina #${{ matrix.worker_id }} de ${{ needs.preparar-enxame.outputs.total_workers }}
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          MERCADO: "fort"
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ needs.preparar-enxame.outputs.total_workers }}
          SWARM_RUN_ID: ${{ needs.preparar-enxame.outputs.swarm_id }}
          MODO_FILA: ${{ needs.preparar-enxame.outputs.modo_camada }}
          BATCH_SIZE: ${{ github.event.inputs.tamanho_lote_size || '20' }}
          DELAY_MS: ${{ github.event.inputs.delay_paginas_ms || '2200' }}
          DELAY_ROTA_MS: ${{ github.event.inputs.delay_categorias_ms || '3800' }}
          START_INDEX: ${{ github.event.inputs.rota_inicial || '' }}
          SALVAR_AO_ADICIONAR: ${{ github.event.inputs.salvar_ao_adicionar || '300' }}
          SALVAR_AO_ATUALIZAR: ${{ github.event.inputs.salvar_ao_atualizar || '100' }}
          DRY_RUN: ${{ github.event.inputs.modo_teste_sem_gravar || 'false' }}
        run: node scripts/extrator-cloud.mjs

      - name: 📦 Backup de Segurança do Firebase Fort Atacadista
        if: always() && matrix.worker_id == 1
        uses: actions/upload-artifact@v4
        with:
          name: backup-fort-1644-${{ github.run_number }}
          path: backup_fort_1644_antes.json
          retention-days: 14

  # Etapa 3: Vinculação Inteligente Multi-Fator (Koch × Fort)
  vincular-produtos:
    needs: [preparar-enxame, extrator-koch, extrator-fort]
    if: always() && !cancelled() && (needs.preparar-enxame.outputs.modo_camada == 'COMPLETA' || needs.preparar-enxame.outputs.modo_camada == '2A' || needs.preparar-enxame.outputs.mercado_escolhido == 'vincular')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🔗 Executar Vinculação Inteligente de Produtos (SuperKoch × Fort Atacadista)
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: node scripts/extrator-cloud.mjs --vincular

  # Etapa 4: Auto-Revezamento Contínuo 24/7 (Garante que o robô NUNCA pare entre os turnos de 24h, 3h e 12h)
  auto-continuar:
    needs: [preparar-enxame, extrator-koch, extrator-fort, vincular-produtos]
    if: always() && !cancelled() && needs.preparar-enxame.outputs.mercado_escolhido != 'vincular'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Disparar Próximo Turno Automaticamente (24h Sem Parar / 3h Ampla / 12h Completa)
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          node -e '
            (async () => {
              const base = process.env.FIREBASE_URL;
              const sec = (process.env.FIREBASE_SECRET || "").trim();
              const q = sec ? `?auth=${encodeURIComponent(sec)}` : "";
              try {
                const [rK, rF] = await Promise.all([
                  fetch(`${base}/robo_controle/comandos.json${q}`).catch(() => null),
                  fetch(`${base}/robo_controle/comandos_fort.json${q}`).catch(() => null)
                ]);
                const cK = rK && rK.ok ? await rK.json().catch(() => null) : null;
                const cF = rF && rF.ok ? await rF.json().catch(() => null) : null;
                const agora = Date.now();
                const cancelK = cK && String(cK.acao || "").toUpperCase() === "CANCELAR" && (agora - Number(cK.timestamp || cK.id || 0)) < 10 * 60 * 1000;
                const cancelF = cF && String(cF.acao || "").toUpperCase() === "CANCELAR" && (agora - Number(cF.timestamp || cF.id || 0)) < 10 * 60 * 1000;
                if (cancelK || cancelF) {
                  console.log("Parada manual recente detectada no painel. Aguardando retomada ou próximo ciclo.");
                  return;
                }
              } catch {}

              const tokens = [process.env.GH_PAT, process.env.GH_TOKEN_DEFAULT].map(t => (t || "").trim()).filter(Boolean);
              for (const tk of tokens) {
                try {
                  const res = await fetch(`https://api.github.com/repos/${process.env.REPO_SLUG}/actions/workflows/robo-koch.yml/dispatches`, {
                    method: "POST",
                    headers: {
                      "Authorization": `Bearer ${tk}`,
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "Mercaro-Auto-Relay"
                    },
                    body: JSON.stringify({
                      ref: "main",
                      inputs: {
                        mercado: "ambos",
                        modo_fila: "AUTO"
                      }
                    })
                  });
                  if (res.status === 204 || res.ok) {
                    console.log("✅ Próximo ciclo automático (24h / 3h / 12h) engatilhado com sucesso!");
                    return;
                  } else {
                    console.log("Aviso ao disparar com token:", res.status);
                  }
                } catch (e) {
                  console.log("Erro ao disparar:", e.message);
                }
              }
            })();
          '
