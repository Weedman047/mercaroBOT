name: 🤖 Robô Mercaro (SuperKoch & Fort Atacadista • Enxame Multi-Máquinas)

on:
  # 1. Permite iniciar manualmente com 1 clique pelo Celular ou PC (Operação Customizada com Prioridade)
  workflow_dispatch:
    inputs:
      mercado:
        description: "🛒 Mercado a Coletar (ambos = Koch + Fort em paralelo, koch = só SuperKoch, fort = só Fort Atacadista)"
        required: false
        default: "ambos"
      total_maquinas:
        description: "🚀 Nº de Máquinas / IPs simultâneos por Mercado (Padrão: 10)"
        required: false
        default: "10"
      modo_fila:
        description: "⚡ Camada de Rastreamento (24H = Contínuo 100% de Onde Parou, 2A = Pesquisa Mediana 1h, COMPLETA = Pesquisa Completa 3h)"
        required: false
        default: "2A"
      tamanho_lote_size:
        description: "📦 Produtos por Requisição (20 = Teto Oficial OSuper p/ Koch e Fort • 12 = Furtivo)"
        required: false
        default: "20"
      delay_paginas_ms:
        description: "Tempo de espera entre páginas em ms (Recomendado: 2200)"
        required: false
        default: "2200"
      delay_categorias_ms:
        description: "Tempo de espera ao trocar de categoria em ms (Recomendado: 3800)"
        required: false
        default: "3800"
      rota_inicial:
        description: "Iniciar a partir de qual número da fila"
        required: false
        default: "1"
      salvar_ao_adicionar:
        description: "Salvar no Firebase ao adicionar X produtos novos (Padrão: 300)"
        required: false
        default: "300"
      salvar_ao_atualizar:
        description: "Salvar no Firebase ao atualizar/salvar X preços/estoques (Padrão: 100)"
        required: false
        default: "100"
      modo_teste_sem_gravar:
        description: "Modo Teste (true = NÃO grava no Firebase, false = Grava normalmente)"
        required: false
        default: "false"

  # 2. Execução contínua e inteligente sem estourar limites:
  # - A cada 3 horas (00h, 03h, 06h, 09h, 12h, 15h, 18h, 21h UTC no minuto 00): Pesquisa Completa (10 máquinas) + Vinculação 100%
  # - A cada 1 hora (demais horas no minuto 00): Pesquisa Mediana (10 máquinas nas categorias principais)
  # - 24 horas contínua (no minuto 12 de cada hora): Roda de onde parou em loop contínuo de 100% dos itens (1 máquina leve, sem estourar cota)
  schedule:
    - cron: "0 * * * *"
    - cron: "12 * * * *"

# Gerenciamento de Prioridade: Se uma operação customizada for disparada, cancela suavemente a em andamento e roda a sua!
concurrency:
  group: robo-mercaro-swarm
  cancel-in-progress: true

jobs:
  # Etapa 1: Prepara a lista de máquinas do enxame (Padrão: 10 servidores com IPs independentes)
  preparar-enxame:
    runs-on: ubuntu-latest
    outputs:
      workers_json: ${{ steps.calc.outputs.workers_json }}
      total_workers: ${{ steps.calc.outputs.total_workers }}
      swarm_id: ${{ steps.calc.outputs.swarm_id }}
      mercado_escolhido: ${{ steps.calc.outputs.mercado_escolhido }}
      modo_camada: ${{ steps.calc.outputs.modo_camada }}
    steps:
      - name: 🧮 Definir parâmetros do Enxame e Camada
        id: calc
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HORA_UTC=$((10#$(date -u +%H)))
            MIN_UTC=$((10#$(date -u +%M)))
            if [ "$MIN_UTC" -ge 10 ] && [ "$MIN_UTC" -le 52 ]; then
              # Pesquisa 24h contínua: 1 máquina leve por mercado, varre 100% dos itens de onde parou sem estourar cota
              MODO_CAMADA="24H"
              RAW_N="1"
            elif [ $((HORA_UTC % 3)) -eq 0 ]; then
              # A cada 3 horas: Pesquisa Completa com 10 máquinas no enxame + Vinculação automática
              MODO_CAMADA="COMPLETA"
              RAW_N="10"
            else
              # A cada 1 hora: Pesquisa Mediana com 10 máquinas nas categorias principais
              MODO_CAMADA="2A"
              RAW_N="10"
            fi
            MERCADO="ambos"
          else
            # Operação customizada disparada pelo usuário: Prioridade Máxima
            MODO_CAMADA="${{ github.event.inputs.modo_fila || '2A' }}"
            RAW_N="${{ github.event.inputs.total_maquinas || '10' }}"
            if [ -z "$RAW_N" ]; then
              RAW_N="10"
            fi
            MERCADO="${{ github.event.inputs.mercado || 'ambos' }}"
          fi

          if ! [[ "$RAW_N" =~ ^[0-9]+$ ]]; then RAW_N="10"; fi
          if [ "$RAW_N" -lt 1 ]; then RAW_N=1; fi
          if [ "$RAW_N" -gt 10 ]; then RAW_N=10; fi
          JSON_ARR=$(seq -s, 1 "$RAW_N" | sed 's/^/[/;s/$/]/')
          SWARM_ID="swarm_$(date +%s)"

          echo "workers_json=$JSON_ARR" >> $GITHUB_OUTPUT
          echo "total_workers=$RAW_N" >> $GITHUB_OUTPUT
          echo "swarm_id=$SWARM_ID" >> $GITHUB_OUTPUT
          echo "mercado_escolhido=$MERCADO" >> $GITHUB_OUTPUT
          echo "modo_camada=$MODO_CAMADA" >> $GITHUB_OUTPUT
          echo "Enxame configurado: Camada $MODO_CAMADA | $RAW_N maquina(s) por mercado (Mercado: $MERCADO | ID: $SWARM_ID)"

  # Etapa 2A: Enxame SuperKoch (Loja 1408 Itapema)
  extrator-koch:
    needs: preparar-enxame
    if: needs.preparar-enxame.outputs.mercado_escolhido != 'fort' && needs.preparar-enxame.outputs.mercado_escolhido != 'vincular'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.preparar-enxame.outputs.workers_json) }}

    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🌐 Instalar Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🔴 Executar SuperKoch • Máquina #${{ matrix.worker_id }} de ${{ needs.preparar-enxame.outputs.total_workers }}
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          MERCADO: "koch"
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ needs.preparar-enxame.outputs.total_workers }}
          SWARM_RUN_ID: ${{ needs.preparar-enxame.outputs.swarm_id }}
          MODO_FILA: ${{ needs.preparar-enxame.outputs.modo_camada }}
          BATCH_SIZE: ${{ github.event.inputs.tamanho_lote_size || '20' }}
          DELAY_MS: ${{ github.event.inputs.delay_paginas_ms || '2200' }}
          DELAY_ROTA_MS: ${{ github.event.inputs.delay_categorias_ms || '3800' }}
          START_INDEX: ${{ github.event.inputs.rota_inicial || '1' }}
          SALVAR_AO_ADICIONAR: ${{ github.event.inputs.salvar_ao_adicionar || '300' }}
          SALVAR_AO_ATUALIZAR: ${{ github.event.inputs.salvar_ao_atualizar || '100' }}
          DRY_RUN: ${{ github.event.inputs.modo_teste_sem_gravar || 'false' }}
        run: node scripts/extrator-cloud.mjs

      - name: 📦 Backup de Segurança do Firebase SuperKoch
        if: always() && matrix.worker_id == 1
        uses: actions/upload-artifact@v4
        with:
          name: backup-koch-1408-${{ github.run_number }}
          path: backup_koch_1408_antes.json
          retention-days: 14

  # Etapa 2B: Enxame Fort Atacadista (Loja 1644 Porto Belo) - RODA SIMULTANEAMENTE!
  extrator-fort:
    needs: preparar-enxame
    if: needs.preparar-enxame.outputs.mercado_escolhido != 'koch' && needs.preparar-enxame.outputs.mercado_escolhido != 'vincular'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(needs.preparar-enxame.outputs.workers_json) }}

    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🌐 Instalar Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🟢 Executar Fort Atacadista • Máquina #${{ matrix.worker_id }} de ${{ needs.preparar-enxame.outputs.total_workers }}
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          MERCADO: "fort"
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: ${{ needs.preparar-enxame.outputs.total_workers }}
          SWARM_RUN_ID: ${{ needs.preparar-enxame.outputs.swarm_id }}
          MODO_FILA: ${{ needs.preparar-enxame.outputs.modo_camada }}
          BATCH_SIZE: ${{ github.event.inputs.tamanho_lote_size || '20' }}
          DELAY_MS: ${{ github.event.inputs.delay_paginas_ms || '2200' }}
          DELAY_ROTA_MS: ${{ github.event.inputs.delay_categorias_ms || '3800' }}
          START_INDEX: ${{ github.event.inputs.rota_inicial || '1' }}
          SALVAR_AO_ADICIONAR: ${{ github.event.inputs.salvar_ao_adicionar || '300' }}
          SALVAR_AO_ATUALIZAR: ${{ github.event.inputs.salvar_ao_atualizar || '100' }}
          DRY_RUN: ${{ github.event.inputs.modo_teste_sem_gravar || 'false' }}
        run: node scripts/extrator-cloud.mjs

      - name: 📦 Backup de Segurança do Firebase Fort Atacadista
        if: always() && matrix.worker_id == 1
        uses: actions/upload-artifact@v4
        with:
          name: backup-fort-1644-${{ github.run_number }}
          path: backup_fort_1644_antes.json
          retention-days: 14

  # Etapa 3: Vinculação Inteligente Multi-Fator (Koch × Fort)
  vincular-produtos:
    needs: [preparar-enxame, extrator-koch, extrator-fort]
    if: always() && !cancelled() && (needs.preparar-enxame.outputs.modo_camada == 'COMPLETA' || needs.preparar-enxame.outputs.modo_camada == '2A' || needs.preparar-enxame.outputs.mercado_escolhido == 'vincular')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código do projeto
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🔗 Executar Vinculação Inteligente de Produtos (SuperKoch × Fort Atacadista)
        env:
          FIREBASE_URL: "https://mercaro-e6035-default-rtdb.firebaseio.com"
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: node scripts/extrator-cloud.mjs --vincular
