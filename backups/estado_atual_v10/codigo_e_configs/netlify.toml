# Configuração automática para publicar o BuscaPreço + Central do Robô no Netlify
# Ignora a instalação do Playwright (que roda apenas no GitHub Actions) para publicar o site em 2 segundos!

[build]
  publish = "."
  command = "echo 'Deploy estático BuscaPreço + Central do Robô concluído!'"

[build.environment]
  NODE_ENV = "production"
  NPM_FLAGS = "--ignore-scripts"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
